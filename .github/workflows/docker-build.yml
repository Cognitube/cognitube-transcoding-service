name: Docker Build and Push

on:
    push:
        branches:
            - '**'
    release:
        types:
            - created

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        environment: production
        steps:
            - name: Check Out Repo
              uses: actions/checkout@v2

            - name: Log in to Docker Hub
              uses: docker/login-action@v1
              with:
                  registry: ${{ secrets.AZURE_REGISTRY_NAME }}
                  username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
                  password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v1

            - name: Generate tag
              id: prep
              run: |
                  if [[ "${{ github.ref }}" == 'refs/heads/main' ]]; then
                    echo "tag=latest" >> $GITHUB_ENV
                  elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
                    echo "tag=${{ github.ref_name }}" >> $GITHUB_ENV
                  else
                    echo "tag=$(date +'%Y%m%d%H%M%S')-$(git rev-parse --short HEAD)" >> $GITHUB_ENV
                  fi

            - name: Build and Push Docker image
              uses: docker/build-push-action@v2
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: |
                      ${{ secrets.AZURE_REGISTRY_NAME }}/cognitube-transcoding-service:${{ env.tag }}
                      ${{ secrets.AZURE_REGISTRY_NAME }}/cognitube-transcoding-service:latest
                  platforms: linux/amd64,linux/arm64

            - name: List Docker images after build
              run: docker images

            - name: Clean up Post Run
              run: |
                  docker rmi ${{ secrets.AZURE_REGISTRY_NAME }}/cognitube-transcoding-service:${{ env.tag }} || true
                  if [[ "${GITHUB_REF}" == 'refs/heads/main' ]]; then
                    docker rmi ${{ secrets.AZURE_REGISTRY_NAME }}/cognitube-transcoding-service:latest || true
                  fi
